name: Build Shattered Realms Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "native/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "native/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

concurrency:
  group: shattered-realms-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      HAS_RELEASE_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        shell: bash
        run: |
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"             "platform-tools"             "build-tools;36.0.0"             "platforms;android-36"

      - name: Verify required game assets exist
        run: |
          test -f native/assets/3d/game-ready/ashenreach-hex-board/ashenreach_hex_board.glb
          for part in {00..09}; do test -f "native/assets/3d/game-ready/ravenwood-board/ravenwood_section_${part}.glb"; done
          for map in albedo normal metal_rough; do test -f "native/assets/3d/game-ready/ravenwood-board/ravenwood_${map}.jpg"; done
          test -f native/assets/3d/game-ready/ravenwood-board/generated/ravenwood_nav_surface.glb
          python3 - <<'PY'
          import json, pathlib, struct
          board=pathlib.Path('native/assets/3d/game-ready/ravenwood-board')
          sections=list(board.glob('ravenwood_section_*.glb'))
          assert len(sections)==10
          for section in sections:
              data=section.read_bytes()
              assert len(data)<2*1024*1024, section
              json_length=struct.unpack_from('<I',data,12)[0]
              scene=json.loads(data[20:20+json_length])
              assert not scene.get('images') and not scene.get('textures'), section
              assert scene['accessors'][scene['meshes'][0]['primitives'][0]['indices']]['componentType']==5123
          assert sum(json.loads(p.read_bytes()[20:20+struct.unpack_from('<I',p.read_bytes(),12)[0]])['accessors'][0]['count']//3 for p in sections)==650000
          grid=json.load(open('native/data/generated/ravenwood_nav_grid.json'))
          assert grid['tile_count']==len(grid['tiles']) and grid['tile_count']>2000
          for key,tile in grid['tiles'].items():
              for other in tile['blocked_edges']:
                  assert key in grid['tiles'][other]['blocked_edges']
          print('[ravenwood] movement grid verified:',grid['tile_count'])
          PY

      - name: Verify Golden Expanse terrain and crossings
        run: python3 native/tools/verify_golden_expanse_board.py

      - name: Generate playable hero meshes
        shell: bash
        run: |
          python3 native/tools/extract_hero_piece.py
          test -f native/assets/3d/heroes/generated/vesper_single.glb
          test -f native/assets/3d/heroes/generated/ignis_single.glb

      - name: Generate Ashenreach battle backdrop
        shell: bash
        run: |
          python3 -m pip install --quiet pillow
          python3 native/tools/generate_battle_backdrop.py
          test -f native/assets/battle/generated/ashenreach_battle_arena.png
          python3 - <<'PY'
          from PIL import Image
          p="native/assets/battle/generated/ashenreach_battle_arena.png"
          with Image.open(p) as im:
              im.load()
              assert im.size == (1280,720), im.size
          print("[battle] verified", p)
          PY

      - name: Generate Ashenreach navigation surface
        shell: bash
        run: |
          python3 -m pip install --quiet numpy trimesh rtree
          python3 native/tools/generate_ashenreach_nav_surface.py
          test -f native/assets/3d/game-ready/ashenreach-hex-board/generated/ashenreach_nav_surface.glb
          test -f native/data/generated/ashenreach_nav_grid.json
          ls -lh native/assets/3d/game-ready/ashenreach-hex-board/generated/ashenreach_nav_surface.glb
          ls -lh native/data/generated/ashenreach_nav_grid.json

      - name: Validate Godot project scripts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot-validate"
          cd "$RUNNER_TEMP/godot-validate"
          curl -L --fail --retry 3 -o godot.zip "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -q godot.zip
          GODOT_BIN="$(find . -maxdepth 1 -type f -name 'Godot_v4.7.2-stable_linux.x86_64*' | head -n 1)"
          chmod +x "$GODOT_BIN"
          set +e
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE/native" --editor --quit 2>&1 | tee "$RUNNER_TEMP/godot-validation.log"
          GODOT_EXIT=${PIPESTATUS[0]}
          set -e
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script" "$RUNNER_TEMP/godot-validation.log"; then
            echo "Godot script validation failed."
            exit 1
          fi
          if [ "$GODOT_EXIT" -ne 0 ]; then
            echo "Godot validation exited with code $GODOT_EXIT."
            exit "$GODOT_EXIT"
          fi
          for scene in "res://scenes/BoardWorkshop.tscn" "res://scenes/RavenwoodPreview.tscn"; do
            echo "Smoke testing $scene"
            set +e
            timeout 90 "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE/native" --scene "$scene" --quit-after 30 2>&1 | tee "$RUNNER_TEMP/godot-scene-smoke.log"
            SCENE_EXIT=${PIPESTATUS[0]}
            set -e
            if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script" "$RUNNER_TEMP/godot-scene-smoke.log"; then
              echo "Godot scene smoke test reported a script error."
              exit 1
            fi
            if [ "$SCENE_EXIT" -ne 0 ]; then
              echo "Godot scene smoke test exited with code $SCENE_EXIT."
              exit "$SCENE_EXIT"
            fi
          done

      - name: Set monotonic Android version
        shell: bash
        run: |
          VERSION_CODE=$(date +%s)
          VERSION_NAME="0.2.${GITHUB_RUN_NUMBER}"
          sed -i "s/version\/code=.*/version\/code=$VERSION_CODE/" native/export_presets.cfg
          sed -i "s/version\/name=.*/version\/name=\"$VERSION_NAME\"/" native/export_presets.cfg
          echo "Building version $VERSION_NAME ($VERSION_CODE)"

      - name: Prepare permanent release signing
        if: env.HAS_RELEASE_KEY == 'true'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/shattered-signing"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/shattered-signing/shattered-realms-release.keystore"
          chmod 600 "$RUNNER_TEMP/shattered-signing/shattered-realms-release.keystore"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$RUNNER_TEMP/shattered-signing/shattered-realms-release.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Export permanently signed release APK
        if: env.HAS_RELEASE_KEY == 'true'
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          relative_project_path: ./native
          presets_to_export: "Android APK"
          export_debug: false
          cache: true
          verbose: true
          use_preset_export_path: true

      - name: Export temporary debug APK
        if: env.HAS_RELEASE_KEY != 'true'
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          relative_project_path: ./native
          presets_to_export: "Android APK"
          export_debug: true
          cache: true
          verbose: true
          use_preset_export_path: true

      - name: Show build output
        run: |
          find native/build -maxdepth 3 -type f -print || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShatteredRealms-Android
          path: native/build/Android APK/ShatteredRealms.apk
          if-no-files-found: error
          retention-days: 1
