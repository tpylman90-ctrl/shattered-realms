name: Build Ashenreach Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "native/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        shell: bash
        run: |
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"             "platform-tools"             "build-tools;36.0.0"             "platforms;android-36"

      - name: Verify required game assets exist
        run: |
          test -f native/assets/3d/game-ready/ashenreach_terrain_high.glb
          test -f native/assets/3d/game-ready/ashenreach_gate_game.glb

      - name: Export Godot Android debug APK
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          relative_project_path: ./native
          presets_to_export: "Android APK"
          export_debug: true
          cache: true
          verbose: true
          use_preset_export_path: true

      - name: Show build output
        run: |
          find native/build -maxdepth 3 -type f -print || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShatteredRealms_AshenreachDemo_v0.1
          path: native/build/Android APK/ShatteredRealms_AshenreachDemo_v0.1.apk
          if-no-files-found: error
          retention-days: 30
